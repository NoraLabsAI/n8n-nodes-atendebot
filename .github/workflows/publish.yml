# Publishes to npm with provenance when a version tag (v0.1.0, v1.2.3, v1.0.0-rc.1) is pushed.
# Authentication is npm trusted publishing (OIDC): no token or secret is stored anywhere.
# One-time setup on npmjs.com (package settings > Trusted Publisher > GitHub Actions):
#   organization NoraLabsAI, repository n8n-nodes-atendebot, workflow publish.yml, no environment.
# See "Releasing" in the README.
name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Mints the OIDC token that npm exchanges for a publish credential and signs the provenance.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Run tests
        run: npm test

      - name: Publish
        # RELEASE_MODE lets the prepublishOnly guard of @n8n/node-cli pass; the lint and build
        # above already ran, and the guard only blocks a publish done by hand.
        run: npm publish --provenance --access public
        env:
          RELEASE_MODE: 'true'
